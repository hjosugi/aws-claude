# cjp policy.
# Edit this file, then build again. The built exe embeds this file,
# so people who only have the exe can not change it.
#
# Japan only: every model must be a jp. inference profile, or an
# application inference profile ARN in ap-northeast-1 or ap-northeast-3.

# Bedrock source region: ap-northeast-1 (Tokyo) or ap-northeast-3 (Osaka).
region: ap-northeast-1

# Allowed models. Keys are tiers: haiku, sonnet, opus.
# Sonnet 5.5 has no jp. profile yet (Oct 2026), so sonnet uses Sonnet 4.6.
models:
  haiku: jp.anthropic.claude-haiku-5-5
  sonnet: jp.anthropic.claude-sonnet-4-6
  # opus: jp.anthropic.claude-opus-4-8

# Model at start. Use one of the tier names above.
default_model: haiku

# Compact the chat before it reaches this many tokens (100000 to 1000000).
# Haiku 5.5 costs 5x for prompts over 100K tokens, so keep 100000.
auto_compact_window: 100000

# Effort level: low, medium, high, or xhigh.
effort_level: low

# WebFetch sends requests to sites outside Japan. Keep false for Japan only.
allow_web_fetch: false

# true: deny the Grep tool and grep/rg in Bash, so Claude uses the code graph.
block_grep: false

# Helper tools that cjp installs and keeps on.
tools:
  rtk: true
  graphify: true

# AWS login. With empty values, claude uses the default AWS credential chain.
# cjp never uses a claude.ai login or an Anthropic API key.
aws:
  # Profile in ~/.aws/config. cjp sets AWS_PROFILE to it and removes AWS key env vars,
  # so claude can only use this profile.
  profile: ""
  # IAM role for Claude Code. cjp adds a profile for this role to ~/.aws/config
  # when it is missing. The profile name is the value above, or "cjp".
  role_arn: ""
  # Profile that logs in before the role is assumed. Default: "default".
  source_profile: ""
  # Command that claude runs when the credentials are expired.
  # Example: aws sso login --profile my-sso
  auth_refresh: ""

# Local proxy. claude and the tools it starts can only reach the allowed hosts.
# The AWS endpoints in the Japan regions are always allowed (see: cjp cjp-policy).
proxy:
  enabled: true
  # Corporate proxy to go through, as http://host:port.
  # Empty: cjp uses HTTPS_PROXY, or the proxy from the OS settings.
  upstream: ""
  # More hosts to allow. "*.example.co.jp" allows every host below example.co.jp.
  # This list is enough for normal development work. Each host is also a way out
  # for data, so remove the groups that you do not need. For AWS only: allow_hosts: []
  # Hosts for one environment (for example an internal repository) go into .env:
  # CJP_PROXY_ADD_HOSTS adds them to this list.
  allow_hosts:
    # GitHub: git over https, gh, and release downloads (uv installs Python from there).
    - github.com
    - api.github.com
    - codeload.github.com
    - raw.githubusercontent.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    # Python: uv and pip. "uv run" needs these for scripts with packages.
    - pypi.org
    - files.pythonhosted.org
    # Node.js: npm and npx.
    - registry.npmjs.org
    # Java: Maven Central and Gradle. Only tools that use the proxy env vars come
    # through the proxy (mvnw with curl, for example). Java itself does not use them.
    - repo.maven.apache.org
    - repo1.maven.org
    - plugins.gradle.org
    - plugins-artifacts.gradle.org
    - services.gradle.org
    - downloads.gradle.org
